<script>
'use strict';
const IS_NODE=typeof document==='undefined';

const hasKw=(x,k)=>C(x).kw.includes(k)||!!(x.tmp&&x.tmp.includes(k))||auras(x).some(a=>a.kw===k);
const paOf=x=>{let v=0;for(const k of C(x).kw){const m=/^pa(\d+)$/.exec(k);if(m){v=+m[1];break}}for(const a of auras(x)){const m=/^pa(\d+)$/.exec(a.kw||'');if(m)v+=+m[1]}return v};

/* ---------- image sprites ---------- */

 for(const x of ss){zdone.add(x);front?zq.unshift(x):zq.push(x)}zpump()}

const KWN={double:'Double breaker',triple:'Triple breaker',speed:'Speed Attacker',blocker:'Blocker',slayer:'Slayer',trigger:'Shield Trigger',crew:'Crew breaker',charger:'Charger'};
function fxTxt(f){if(f.txt)return f.txt;switch(f.op){case 'destroy':return `Destroy one rival creature${f.maxPower?` with ${f.maxPower} power or less`:''}.`;case 'destroyAll':return `Destroy all creatures with ${f.maxPower} power or less.`;
 case 'bounce':return "Return a creature to its owner's hand.";case 'tap':return `Tap ${f.n>1?'up to '+f.n:'one'} rival creature${f.n>1?'s':''}.`;
 case 'draw':return `Draw ${f.optional?'up to ':''}${f.n} card${f.n>1?'s':''}.`;case 'shieldTop':return `Add ${f.n} card${f.n>1?'s':''} to your shields.`;
 case 'manaTop':return 'Put the top card of your deck into mana.';case 'buff':return `+${f.amount} power until end of turn.`;case 'searchRace':return `Search your deck for an ${f.race}.`}return ''}
const GLOW={F:'#ff3b30',W:'#5ac8fa',N:'#34c759',L:'#ffd53d',D:'#9b6dff'};
const mixc=(h,k)=>{const n=parseInt(h.slice(1),16),b=[21,24,38],r=[n>>16&255,n>>8&255,n&255];return '#'+r.map((v,i)=>Math.round(b[i]+(v-b[i])*k).toString(16).padStart(2,'0')).join('')};
const civBand=civ=>{const cs=civ.map(c=>GLOW[c]);const dark=cs.map(c=>mixc(c,.32)),mid=cs.map(c=>mixc(c,.55));
 const bg=cs.length>1?`linear-gradient(90deg,${dark.map((d,i)=>`${d} ${i*100/(cs.length)}%,${mid[i]} ${(i+.5)*100/cs.length}%`).join(',')},${dark[dark.length-1]} 100%)`:`linear-gradient(90deg,${dark[0]},${mid[0]} 60%,${dark[0]})`;
 const lc=cs.length>1?'#fff':cs[0];const ico=civ.map((c,i)=>`<div style="position:absolute;left:${cs.length>1?1730+i*160:('LF'.includes(c)?1740:1715)}px;top:${cs.length>1?170:('LF'.includes(c)?105:80)}px;width:${cs.length>1?140:('LF'.includes(c)?280:330)}px;height:${cs.length>1?140:('LF'.includes(c)?280:330)}px;filter:drop-shadow(0 0 22px ${GLOW[c]})"><div style="width:100%;height:100%;background:${GLOW[c]};-webkit-mask:url(atl/civ_${c}.png) center/contain no-repeat;mask:url(atl/civ_${c}.png) center/contain no-repeat"></div></div>`).join('');
 return {bg,lc,ico,kc:cs.length>1?'#fff':cs[0]}};
const gv=id=>`--g:${GLOW[CARDS[id].civ[0]]}`;const gc=id=>CARDS[id].civ.length>1?' rb':'';
const kwTxt=c=>c.kw.map(k=>KWN[k]||(/^pa\d+$/.test(k)?'Power Attacker +'+k.slice(2):'')).filter(Boolean).join(' · ')+(c.rs&&c.rs.length?(c.kw.length?' · ':'')+c.rs.map(r=>({unblock:"Can't be blocked",unatk:"Can't be attacked",noatk:"Can't attack",atkU:'Attacks untapped creatures'}[r.k]||'')+(r.by?' (some)':'')+(r.cond?' (conditional)':'')).join(' · '):'');
/* ---------- game state ---------- */
let G=null,AUTO=false,uidc=1;
const inst=id=>({id,uid:uidc++});
function newPlayer(deck,human,i){const d=shuffle(deck.map(inst));const p={i,human,deck:d,hand:[],shields:[],mana:[],bf:[],gy:[],charged:false};
 for(let k=0;k<5;k++)p.shields.push(p.deck.pop());for(let k=0;k<5;k++)p.hand.push(p.deck.pop());return p}
function log(s){G.log.push(s);if(G.log.length>200)G.log.shift()}
const nm=x=>C(x).n;
function ownerOf(cr){return G.p.find(p=>p.bf.includes(cr))}
function cardsOf(cr){return [{id:cr.id,uid:cr.uid},...cr.under]}
function crRaces(cr){return C(cr).race}
function power(cr,att,vs){let v=(C(cr).p||0)+cr.buf;const ow=ownerOf(cr);
 for(const a of auras(cr))if(a.n)v+=a.n;
 const pw=C(cr).pw;if(pw&&ow)for(const r of pw){if(r.att&&!att)continue;if(r.vs&&!(vs&&byOk(r.vs,vs)))continue;if(!condOk(ow,r.cond,cr))continue;v+=r.n*(r.each?countEach(ow,r.each,cr):1)}
 if(ow)for(const o of ow.bf){if(o===cr)continue;const st=C(o).st;if(st)for(const s of st)if(crRaces(cr).includes(s.buffRace))v+=s.n}
 if(att)v+=paOf(cr);return v}
function breakCount(p,cr){if(hasKw(cr,'triple'))return 3;if(hasKw(cr,'double'))return 2;
 if(hasKw(cr,'crew')){const r=C(cr).crewRace;return Math.max(1,p.bf.filter(o=>crRaces(o).includes(r)).length)}return 1}
/* ---------- mana ---------- */
function planPay(p,id){const c=CARDS[id],un=p.mana.filter(m=>!m.tapped);if(un.length<c.cost)return null;const ch=[];
 for(const civ of c.civ){if(ch.some(m=>C(m).civ.includes(civ)))continue;
  const cand=un.filter(m=>!ch.includes(m)&&C(m).civ.includes(civ)).sort((a,b)=>C(a).civ.length-C(b).civ.length);
  if(!cand.length)return null;ch.push(cand[0])}
 const rest=un.filter(m=>!ch.includes(m)).sort((a,b)=>C(a).civ.length-C(b).civ.length);
 while(ch.length<c.cost)ch.push(rest.shift());return ch}
function evoBases(p,id){const c=CARDS[id];if(!c.evo)return [];if(!c.evoRaces)return null;
 return p.bf.filter(b=>crRaces(b).some(r=>c.evoRaces.some(e=>e[0]==='~'?r.toLowerCase().includes(e.slice(1).toLowerCase()):(r.toLowerCase()===e.toLowerCase()||r.toLowerCase()===e.toLowerCase()+'s'))))}
function canPlay(p,h){const c=C(h);if(G.cur===p.i&&(G.ph||0)>2)return false;if(!c.evo&&c.t==='creature'&&p.bf.length>=7)return false;if(!planPay(p,h.id))return false;if(c.evo){const b=evoBases(p,h.id);if(!b||!b.length)return false}return true}
function whyNot(p,h){const c=C(h);if(G.cur===p.i&&(G.ph||0)>2)return 'Too late: you already attacked this turn';
 if(!c.evo&&c.t==='creature'&&p.bf.length>=7)return 'Battle zone is full (7)';
 const un=p.mana.filter(m=>!m.tapped);if(un.length<c.cost)return `Need ${c.cost} untapped mana (you have ${un.length})`;
 for(const civ of c.civ)if(!un.some(m=>C(m).civ.includes(civ)))return `Needs a ${CIVN[civ]} mana card (you have none untapped)`;

function addMana(p,card,tapped){p.mana.push({id:card.id,uid:card.uid,tapped:tapped||C(card).civ.length>1})}
/* ---------- choose ---------- */
async function choose(p,title,opts,o={}){if(!opts.length)return -1;
 if(p.human&&!AUTO)return await ui.choose(title,opts,!!o.none);
 return o.ai?o.ai(opts):0}
const argmax=(a,f)=>{let b=0;a.forEach((x,i)=>{if(f(x)>f(a[b]))b=i});return b};
async function pickCr(p,title,list,pref,none){ // list of crs
 const opts=list.map(cr=>({id:cr.id,label:`${nm(cr)} (${power(cr)})`,cr}));
 const i=await choose(p,title,opts,{none,ai:o=>pref==='low'?argmax(o,x=>-power(x.cr)):argmax(o,x=>power(x.cr))});
 return i<0?null:list[i]}
/* ---------- card movement ---------- */
function drawCard(p,n=1){for(let k=0;k<n;k++){if(!p.deck.length){G.over=true;G.winner=1-p.i;log(`${p.i?'Opponent':'You'} ran out of cards!`);return false}p.hand.push(p.deck.pop())}return true}
async function destroyCr(cr){const ow=ownerOf(cr);if(!ow)return;
 const rp=(C(cr).fx||[]).find(f=>f.when==='wouldDie'&&f.op==='replace');
 if(rp){let go=true;if(rp.optional){const i=await choose(ow,`${nm(cr)} would be destroyed. Use its ability instead?`,[{id:cr.id,label:'Yes'},{label:'No'}],{ai:()=>0});go=i===0}

   if(rp.to==='hand')ow.hand.push(...cs);else if(rp.to==='mana')cs.forEach(c=>addMana(ow,c));else if(rp.to==='shield')ow.shields.push(...cs);else{ow.deck.push(...cs);shuffle(ow.deck)}
   log(`${nm(cr)} went to ${rp.to==='mana'?'mana zone':rp.to==='shield'?'shields':rp.to==='deck'?'the deck':'hand'} instead of being destroyed.`);return}}
 if(!ow.bf.includes(cr))return;
 ui.fxNow('burst',{uid:cr.uid,tone:ow.i?'rival':'you'});ow.bf.splice(ow.bf.indexOf(cr),1);ow.gy.push(...cardsOf(cr));log(`${nm(cr)} was destroyed.`);

function bounceCr(cr){const ow=ownerOf(cr);if(!ow)return;ow.bf.splice(ow.bf.indexOf(cr),1);ow.hand.push(...cardsOf(cr));log(`${nm(cr)} returned to hand.`)}
/* ---------- effects ---------- */
const FX={
 async destroy(p,f){const o=G.p[1-p.i];const l=o.bf.filter(c=>(!f.untappedOnly||!c.tapped)&&(f.maxPower==null||power(c)<=f.maxPower));

 async destroyAll(p,f){const l=[...G.p[0].bf,...G.p[1].bf].filter(c=>power(c)<=f.maxPower);for(const x of l)await destroyCr(x)},
 async bounce(p,f){const l=f.who==='opp'?G.p[1-p.i].bf:[...G.p[1-p.i].bf,...p.bf];

 async draw(p,f){let n=f.n;if(f.optional){if(n===1){const i=await choose(p,'Draw a card?',[{label:'Draw'},{label:'Skip'}],{ai:()=>0});if(i!==0)return}
  else{const opts=[];for(let k=0;k<=n;k++)opts.push({label:'Draw '+k});const i=await choose(p,`Draw up to ${n} cards`,opts,{ai:()=>n});n=i<0?0:i}}

 async shieldTop(p,f){for(let k=0;k<f.n&&p.deck.length&&p.shields.length<10;k++)p.shields.push(p.deck.pop());log(`${p.i?'Opponent':'You'} added shield(s).`)},
 async manaTop(p){if(p.deck.length)addMana(p,p.deck.pop())},
 async buff(p,f){if(!p.bf.length)return;const t=await pickCr(p,`+${f.amount} power to which creature?`,p.bf,'high');if(t){t.buf+=f.amount;log(`${nm(t)} gets +${f.amount}.`)}},

/* ---------- generic effect blocks (parsed from card text) ---------- */
function cardMatch(x,f,isCr){const c=C(x);f=f||{};
 if(f.civ&&!f.civ.some(v=>c.civ.includes(v)))return false;
 if(f.notCiv&&c.civ.some(v=>f.notCiv.includes(v)))return false;
 if(f.type&&c.t!==f.type)return false;
 if(f.race&&!(c.race||[]).some(r=>r.toLowerCase().includes(f.race)))return false;
 if(f.evo&&!c.evo)return false;
 if(f.maxCost!=null&&c.cost>f.maxCost)return false;
 if(f.tapped!=null&&!!x.tapped!==f.tapped)return false;
 if(isCr){if(f.maxPower!=null&&power(x)>f.maxPower)return false;if(f.minPower!=null&&power(x)<f.minPower)return false;
  if(f.exactPower!=null&&power(x)!==f.exactPower)return false;if(f.blocker&&!hasKw(x,'blocker'))return false}

const zoneArr=(s,z)=>z==='bf'?s.bf:z==='gy'?s.gy:z==='mana'?s.mana:z==='hand'?s.hand:z==='shield'?s.shields:s.deck;
function condOk(p,c,src){if(!c)return true;const o=G.p[1-p.i];
 if(c.oppShieldsLE!=null&&o.shields.length>c.oppShieldsLE)return false;
 if(c.meShieldsGE!=null&&p.shields.length<c.meShieldsGE)return false;
 if(c.oppManaMore&&!(o.mana.length>p.mana.length))return false;

 if(c.turbo&&!(p.broke&&[...p.broke].some(u=>!src||u!==src.uid)))return false;

 if(c.brokeSelf&&!(p.broke&&src&&p.broke.has(src.uid)))return false;

 if(c.manaAll&&!(p.mana.length&&p.mana.every(m=>C(m).civ.includes(c.manaAll))))return false;
 if(c.haveCiv&&!p.bf.some(x=>(!c.haveOther||x!==src)&&C(x).civ.includes(c.haveCiv)))return false;
 if(c.meShieldsLE!=null&&p.shields.length>c.meShieldsLE)return false;
 if(c.meOtherCrGE!=null&&p.bf.filter(x=>x!==src).length<c.meOtherCrGE)return false;
 return true}
function byOk(by,o){if(!by)return true;if(!o)return false;
 if(by.civ&&!C(o).civ.some(v=>by.civ.includes(v)))return false;
 if(by.pLE!=null&&power(o)>by.pLE)return false;if(by.pGE!=null&&power(o)<by.pGE)return false;
